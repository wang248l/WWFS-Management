# push 到 main 就上线（2026-11-03 Wallace：「都要自动部署」）。跟 WWFS-Marketing 同一个套路：
# 先在 CI 里类型检查 + build，过了才跑 scripts/deploy-clean.sh（人手动部署也跑同一个脚本）。
#
# 需要仓库 Settings → Secrets and variables → Actions 里有：
#   Secret  DEPLOY_SSH_KEY   能登 droplet root 的部署私钥（跟 WWFS-Marketing 用的是同一把）
#   Var     DEPLOY_HOST      可选，不填就是 159.203.13.193

name: 构建 · 部署

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-management-production
  cancel-in-progress: false

jobs:
  build:
    name: 构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
        env:
          DATABASE_URL: file:./ci.db
      - name: 类型检查
        run: npx tsc --noEmit
      - name: 构建
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          DATABASE_URL: file:./ci.db
          AUTH_SECRET: ci

  deploy:
    name: 部署
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: 装部署钥匙
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "没配 DEPLOY_SSH_KEY。去 Settings → Secrets and variables → Actions 放一把部署私钥（跟 WWFS-Marketing 同一把）。" >&2
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: 跑 scripts/deploy-clean.sh
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '159.203.13.193' }}
        run: bash scripts/deploy-clean.sh
      - name: 收工前擦掉钥匙
        if: always()
        run: rm -f ~/.ssh/id_ed25519
